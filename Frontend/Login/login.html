<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar | Bellemi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../Cliente/Menu/menu.css">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="auth">
    <a class="logo" href="../Cliente/Menu/menu.html">Bellemi<small>&#10047;</small></a>
    <section class="painel">
      <aside class="painel-decorativo" aria-hidden="true">
        <span>Beauty</span>
        <strong>Bellemi</strong>
        <p>Seu cuidado favorito está aqui.</p>
      </aside>
      <div class="painel-formulario">
        <div class="cabecalho-login">
          <span class="saudacao">Bem-vinda de volta</span>
          <h1>Entrar</h1>
          <p>Entre para continuar suas compras.</p>
        </div>
        <form id="formLogin">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" autocomplete="email" required maxlength="250">
          <label for="senha">Senha</label>
          <input id="senha" name="senha" type="password" autocomplete="current-password" required maxlength="20">
          <button class="botao" type="submit">Entrar</button>
        </form>
        <section id="escolhaPerfil" class="escolha-perfil" aria-labelledby="tituloEscolhaPerfil" hidden>
          <h2 id="tituloEscolhaPerfil">Como deseja entrar?</h2>
          <p>Escolha a área que quer acessar agora.</p>
          <button type="button" class="botao botao-perfil" data-perfil="cliente">Entrar como cliente</button>
          <button type="button" class="botao botao-perfil" data-perfil="funcionario">Entrar como funcionário</button>
        </section>
        <p id="mensagem" class="mensagem" role="status" aria-live="polite"></p>
        <p class="links">Ainda não tem conta? <a id="linkCadastro" href="../Cliente/Cadastro/cadastro.html">Cadastre-se</a></p>
        <a class="voltar" href="../Cliente/Menu/menu.html">Voltar à loja</a>
      </div>
    </section>
  </main>
  <script src="login.js"></script>
  <script src="../cookies.js" defer></script>
</body>
</html>
