<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro de cliente | Bellemi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../Menu/menu.css">
  <link rel="stylesheet" href="cadastro.css">
</head>
<body>
  <main class="auth">
    <a class="logo" href="../Menu/menu.html">Bellemi<small>&#10047;</small></a>
    <section class="painel">
      <aside class="painel-decorativo" aria-hidden="true">
        <span>Nova cliente</span>
        <strong>Bellemi</strong>
        <p>Crie sua conta e encontre seus favoritos em um só lugar.</p>
      </aside>
      <div class="painel-formulario">
        <div class="cabecalho-cadastro">
          <span class="saudacao">Bem-vinda à Bellemi</span>
          <h1>Criar conta</h1>
          <p>Preencha seus dados para começar.</p>
        </div>
        <form id="formCadastro">
          <div class="campo campo-nome">
            <label for="nome">Nome completo</label>
            <input id="nome" name="nome" autocomplete="name" required maxlength="100">
          </div>
          <div class="campo">
            <label for="cpf">CPF</label>
            <input id="cpf" name="cpf" inputmode="numeric" autocomplete="off" pattern="[0-9]{3}\.?[0-9]{3}\.?[0-9]{3}-?[0-9]{2}" title="Informe um CPF com 11 números" required>
          </div>
          <div class="campo">
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" autocomplete="email" required maxlength="250">
          </div>
          <div class="campo">
            <label for="telefone">Telefone (opcional)</label>
            <input id="telefone" name="telefone" type="tel" autocomplete="tel" maxlength="20">
          </div>
          <div class="campo">
            <label for="renda">Renda mensal (R$)</label>
            <input id="renda" name="renda" type="number" min="0" max="2147483647" step="1" required>
          </div>
          <div class="campo">
            <label for="senha">Senha</label>
            <input id="senha" name="senha" type="password" autocomplete="new-password" required maxlength="20">
          </div>
          <button class="botao" type="submit">Criar conta</button>
        </form>
        <p id="mensagem" class="mensagem" role="status" aria-live="polite"></p>
        <p class="links">Já tem conta? <a id="linkLogin" href="../../Login/login.html">Entrar</a></p>
      </div>
    </section>
  </main>
  <script src="cadastro.js"></script>
  <script src="../../cookies.js" defer></script>
</body>
</html>
